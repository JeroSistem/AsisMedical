<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Redirección</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
        }
        .test-button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Test de Redirección</h1>
    <p>Haz clic en el botón para probar la redirección a la aplicación Next.js:</p>
    
    <button class="test-button" onclick="window.open('http://127.0.0.1:9002/', '_blank')">
        Ir a la Aplicación Next.js
    </button>
    
    <button class="test-button" onclick="window.location.href='http://127.0.0.1:9002/'">
        Redirigir a la Aplicación Next.js
    </button>
    
    <p><small>Si no funciona, verifica que la aplicación esté ejecutándose en el puerto 9002</small></p>
</body>
</html>
