# Blueprint Render — ASIS Medical
# https://render.com/docs/blueprint-spec
# https://render.com/articles/how-to-deploy-next-js-applications-with-ssr-and-api-routes

databases:
  - name: asismedical-db
    plan: free
    databaseName: asis_medical
    user: asismedical

services:
  - type: web
    name: asismedical-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    # next start usa process.env.PORT de Render; no forzar -p
    startCommand: npx prisma db push --skip-generate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        fromDatabase:
          name: asismedical-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_FORCE_SPANISH
        value: "true"
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: es
