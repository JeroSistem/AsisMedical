# Blueprint Render — imagen desde GitHub Actions (ghcr.io/jerosistem/asismedical:latest)
# DATABASE_URL: solo MySQL/MariaDB (mysql://...)

services:
  - type: web
    name: asismedical-web
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/jerosistem/asismedical:latest
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://asismedical-web.onrender.com
      - key: NEXT_PUBLIC_FORCE_SPANISH
        value: "true"
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: es
