# Blueprint Render — ASIS Medical
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: asismedical-db
    plan: free
    databaseName: asis_medical
    user: asismedical

services:
  - type: web
    name: asismedical-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Build en Render (memoria limitada en free)
    buildCommand: npm ci && npx prisma generate && npm run build
    # Render inyecta $PORT; la app DEBE escucharlo (no 9002 fijo)
    preDeployCommand: npx prisma db push --skip-generate
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        fromDatabase:
          name: asismedical-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Tras el primer deploy, pon en el dashboard la URL pública del servicio
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_FORCE_SPANISH
        value: "true"
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: es
