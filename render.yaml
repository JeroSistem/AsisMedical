# Blueprint Render — ASIS Medical (mínimo / free tier)
# https://render.com/docs/blueprint-spec

databases:
  - name: asismedical-db
    plan: free
    databaseName: asis_medical
    user: asismedical

services:
  - type: web
    name: asismedical-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        fromDatabase:
          name: asismedical-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://asismedical-web.onrender.com
      - key: NEXT_PUBLIC_FORCE_SPANISH
        value: "true"
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: es
