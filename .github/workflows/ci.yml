name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: asis_medical_test
          MYSQL_USER: asis
          MYSQL_PASSWORD: asis
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uasis -pasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: mysql://asis:asis@127.0.0.1:3306/asis_medical_test

      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: mysql://asis:asis@127.0.0.1:3306/asis_medical_test

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: mysql://asis:asis@127.0.0.1:3306/asis_medical_test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:9002

      - name: Run linting
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        continue-on-error: true
        run: npm run test:run
        env:
          DATABASE_URL: mysql://asis:asis@127.0.0.1:3306/asis_medical_test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:9002

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
