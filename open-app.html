<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Aplicación Next.js</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .button {
            background: #28a745;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .button:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Abrir Aplicación Next.js</h1>
        
        <div class="status">
            <strong>Estado:</strong> Aplicación ejecutándose en puerto 9002
        </div>
        
        <p>Haz clic en el botón para abrir la aplicación de login:</p>
        
        <a href="http://localhost:9002/" class="button" target="_blank">
            🔐 Abrir Login de la Aplicación
        </a>
        
        <br><br>
        
        <a href="http://127.0.0.1:9002/" class="button" target="_blank">
            🌐 Abrir con IP Local
        </a>
        
        <br><br>
        
        <a href="index.html" class="button">
            🏠 Volver al Index Principal
        </a>
        
        <div class="status">
            <strong>Credenciales de Prueba:</strong><br>
            Email: neder.jero@gmail.com<br>
            Password: admin123
        </div>
    </div>

    <script>
        // Auto-redirect después de 3 segundos
        setTimeout(function() {
            window.open('http://localhost:9002/', '_blank');
        }, 3000);
    </script>
</body>
</html>
